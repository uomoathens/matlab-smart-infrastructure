name: Run examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "examples/**/*.m"
      - "examples/**/data/**"
      - "run_all.m"
      - ".github/workflows/run-examples.yml"

permissions:
  contents: write

concurrency:
  group: run-examples
  cancel-in-progress: true

jobs:
  run-examples:
    name: MATLAB ${{ matrix.release }}
    runs-on: ubuntu-latest
    env:
      HAS_MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        release: [R2023b, latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out licensed media
        if: env.HAS_MEDIA_TOKEN == 'true'
        uses: actions/checkout@v6
        with:
          repository: uomoathens/matlab-smart-infrastructure-media
          token: ${{ secrets.MEDIA_TOKEN }}
          path: .media

      - name: Stage licensed media
        if: env.HAS_MEDIA_TOKEN == 'true'
        run: |
          mkdir -p examples/06-construction-worker-safety/data
          cp .media/site-construction-workers.mp4 examples/06-construction-worker-safety/data/

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          products: Statistics_and_Machine_Learning_Toolbox Optimization_Toolbox Global_Optimization_Toolbox Image_Processing_Toolbox Computer_Vision_Toolbox

      - name: Run all examples
        uses: matlab-actions/run-command@v3
        with:
          command: run_all

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.release }}
          path: examples/*/results/

      - name: Commit results
        if: matrix.release == 'latest'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/*/results
          git diff --cached --quiet || git commit -m "Update example results"
          git pull --rebase origin main
          git push
